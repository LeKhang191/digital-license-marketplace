
services:
  migrator:
    profiles:
      - migration
    build:
      context: .
      dockerfile: infra/migrations/Dockerfile
    environment:
      CATALOG_CONNECTION: "Host=postgres;Port=5432;Database=catalog_db;Username=app;Password=${DB_PASSWORD}"
      ORDER_CONNECTION: "Host=postgres;Port=5432;Database=order_db;Username=app;Password=${DB_PASSWORD}"
      LICENSE_CONNECTION: "Host=postgres;Port=5432;Database=license_db;Username=app;Password=${DB_PASSWORD}"   
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    hostname: "${RABBITMQ_HOSTNAME:-rabbitmq}"
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:?KEYCLOAK_VERSION required}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASSWORD:?KC_PASSWORD required}
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - kc_data:/opt/keycloak/data
      - ./infra/keycloak/marketplace-realm.json:/opt/keycloak/data/import/marketplace-realm.json:ro
    networks:
      - backend
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=catalog_db;Username=app;Password=${DB_PASSWORD}"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=order_db;Username=app;Password=${DB_PASSWORD}"
      Services__CatalogUrl: "http://catalog:8080"
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__ReturnUrl: "${VNPAY_RETURN_URL:-http://localhost:5173/payment/result}"
      RabbitMq__Host: rabbitmq
      RabbitMq__ResultConsumerEnabled: "${ORDER_RESULT_CONSUMER_ENABLED:-false}"
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped


  license-vault:
    build:
      context: .
      dockerfile: services/license-vault-service/Dockerfile
    environment:
      ConnectionStrings__LicenseDb: "Host=postgres;Port=5432;Database=license_db;Username=app;Password=${DB_PASSWORD}"
      Services__CatalogUrl: "http://catalog:8080"

      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"

      LicenseEncryption__EncryptionKey: "${LICENSE_ENCRYPTION_KEY:?LICENSE_ENCRYPTION_KEY required}"
      LicenseEncryption__FingerprintKey: "${LICENSE_FINGERPRINT_KEY:?LICENSE_FINGERPRINT_KEY required}"

      RabbitMq__Host: rabbitmq
      RabbitMq__ConsumerEnabled: "${LICENSE_CONSUMER_ENABLED:-false}"
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}

    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped


  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      Cors__Origins__0: "${FRONTEND_PUBLIC_URL:-http://localhost:5173}"
    ports:
      - "8000:8080"
    depends_on:
      - catalog
      - order
      - license-vault
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  rabbitmq_data:
  pg_data:
  kc_data:

limit_req_zone $binary_remote_addr zone=jira_webhook:1m rate=5r/s;

server {
    listen 8002 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 16k;
    client_body_timeout 10s;

    access_log off;

    location = /api/support/webhooks/jira {
        if ($request_method != POST) {
            return 405;
        }

        limit_req zone=jira_webhook burst=10 nodelay;
        limit_req_status 429;

        set $gateway_upstream gateway:8080;

        proxy_pass http://$gateway_upstream/api/support/webhooks/jira;
        proxy_http_version 1.1;

        proxy_set_header Host gateway;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-DLM-Webhook-Secret $http_x_dlm_webhook_secret;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
    }

    location / {
        return 404;
    }
}

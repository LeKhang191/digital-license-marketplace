services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - backend
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:?KEYCLOAK_VERSION required}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASSWORD:?KC_PASSWORD required}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - kc_data:/opt/keycloak/data
      - ./infra/keycloak/marketplace-realm.json:/opt/keycloak/data/import/marketplace-realm.json:ro
    networks:
      - backend
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=catalog_db;Username=app;Password=${DB_PASSWORD}"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "http://localhost:8081/realms/marketplace"
      Keycloak__RequireHttpsMetadata: "${KEYCLOAK_REQUIRE_HTTPS:-false}"
      GameMetadata__Provider: "${GAME_METADATA_PROVIDER:-Steam}"
      Igdb__ClientId: "${IGDB_CLIENT_ID:-}"
      Igdb__ClientSecret: "${IGDB_CLIENT_SECRET:-}"
      Rawg__ApiKey: "${RAWG_API_KEY:-}"
      Steam__StoreBaseUrl: "${STEAM_STORE_BASE_URL:-https://store.steampowered.com/}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=order_db;Username=app;Password=${DB_PASSWORD}"
      Services__CatalogUrl: "http://catalog:8080"
      Services__LicenseVaultUrl: "http://license-vault:8080"
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:5173/payment/result}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "http://localhost:8081/realms/marketplace"
      Keycloak__RequireHttpsMetadata: "${KEYCLOAK_REQUIRE_HTTPS:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  license-vault:
    build:
      context: .
      dockerfile: services/license-vault-service/Dockerfile
    environment:
      ConnectionStrings__LicenseDb: "Host=postgres;Port=5432;Database=license_db;Username=app;Password=${DB_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      LicenseVault__EncryptionKey: ${LICENSE_VAULT_KEY:?LICENSE_VAULT_KEY required}
      LicenseVault__MaxAllocationAttempts: ${LICENSE_VAULT_MAX_ATTEMPTS:-20}
      LicenseVault__RetryDelaySeconds: ${LICENSE_VAULT_RETRY_SECONDS:-60}
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "http://localhost:8081/realms/marketplace"
      Keycloak__RequireHttpsMetadata: "${KEYCLOAK_REQUIRE_HTTPS:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - catalog
      - order
      - license-vault
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  pg_data:
  kc_data:

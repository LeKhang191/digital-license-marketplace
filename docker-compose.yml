
services:
  migrator:
    profiles:
      - migration
    build:
      context: .
      dockerfile: infra/migrations/Dockerfile
    environment:
      CATALOG_CONNECTION: "Host=postgres;Port=5432;Database=catalog_db;Username=app;Password=${DB_PASSWORD}"
      ORDER_CONNECTION: "Host=postgres;Port=5432;Database=order_db;Username=app;Password=${DB_PASSWORD}"
      LICENSE_CONNECTION: "Host=postgres;Port=5432;Database=license_db;Username=app;Password=${DB_PASSWORD}"
      PAYMENT_CONNECTION: "Host=postgres;Port=5432;Database=payment_db;Username=app;Password=${DB_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      PSQLRC: /etc/dlm/psqlrc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/postgres/psqlrc:/etc/dlm/psqlrc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    hostname: "${RABBITMQ_HOSTNAME:-rabbitmq}"
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:?KEYCLOAK_VERSION required}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASSWORD:?KC_PASSWORD required}
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - kc_data:/opt/keycloak/data
      - ./infra/keycloak/marketplace-realm.json:/opt/keycloak/data/import/marketplace-realm.json:ro
    networks:
      - backend
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      GameMetadata__Provider: ${GAME_METADATA_PROVIDER:-Steam}
      Igdb__ClientId: ${IGDB_CLIENT_ID:-}
      Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:-}
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=catalog_db;Username=app;Password=${DB_PASSWORD}"
      Services__LicenseUrl: "http://license-vault:8080"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=order_db;Username=app;Password=${DB_PASSWORD}"
      Services__CatalogUrl: "http://catalog:8080"
      Services__LicenseUrl: "http://license-vault:8080"
      Services__PaymentUrl: "http://payment:8080"
      InternalService__Key: "${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY required}"
      PartnerWebhooks__AllowPrivateNetwork: "${PARTNER_WEBHOOK_ALLOW_PRIVATE_NETWORK:-false}"
      PartnerWebhooks__AllowInsecureHttp: "${PARTNER_WEBHOOK_ALLOW_INSECURE_HTTP:-false}"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped


  license-vault:
    build:
      context: .
      dockerfile: services/license-vault-service/Dockerfile
    environment:
      InternalService__Key: "${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY required}"
      ConnectionStrings__LicenseDb: "Host=postgres;Port=5432;Database=license_db;Username=app;Password=${DB_PASSWORD}"
      Services__CatalogUrl: "http://catalog:8080"
      Kinguin__Mode: "${KINGUIN_MODE:-Disabled}"
      Kinguin__DemoAutoImport: "${KINGUIN_DEMO_AUTO_IMPORT:-false}"
      Kinguin__ApiKey: "${KINGUIN_SANDBOX_API_KEY:-}"
      Kinguin__LocalProductId: "${KINGUIN_LOCAL_PRODUCT_ID:-}"
      Kinguin__ProductId: "${KINGUIN_PRODUCT_ID:-}"
      Kinguin__ProductMappings: "${KINGUIN_PRODUCT_MAPPINGS:-}"

      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"

      LicenseEncryption__EncryptionKey: "${LICENSE_ENCRYPTION_KEY:?LICENSE_ENCRYPTION_KEY required}"
      LicenseEncryption__FingerprintKey: "${LICENSE_FINGERPRINT_KEY:?LICENSE_FINGERPRINT_KEY required}"

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}

    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped



  payment:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      ConnectionStrings__PaymentDb: "Host=postgres;Port=5432;Database=payment_db;Username=app;Password=${DB_PASSWORD}"
      InternalService__Key: "${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY required}"
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__ReturnUrl: "${VNPAY_RETURN_URL:-http://localhost:5173/payment/result}"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped


  notification:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile

    environment:
      ConnectionStrings__NotificationDb: "Host=postgres;Port=5432;Database=notification_db;Username=app;Password=${DB_PASSWORD}"

      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}

      Smtp__Enabled: "${SMTP_ENABLED:-false}"
      Smtp__Host: "${SMTP_HOST:-smtp.gmail.com}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Digital License Marketplace}"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/notification-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    networks:
      - backend

    restart: unless-stopped


  support:
    build:
      context: .
      dockerfile: services/support-service/Dockerfile

    environment:
      Jira__WebhookSecret: "${JIRA_WEBHOOK_SECRET:-}"
      Jira__Enabled: "${JIRA_ENABLED:-false}"
      Jira__BaseUrl: "${JIRA_BASE_URL:-}"
      Jira__Email: "${JIRA_EMAIL:-}"
      Jira__ApiToken: "${JIRA_API_TOKEN:-}"
      Jira__ServiceDeskId: "${JIRA_SERVICE_DESK_ID:-}"
      Jira__RequestTypeId: "${JIRA_REQUEST_TYPE_ID:-}"
      InternalService__Key: "${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY required}"
      ConnectionStrings__SupportDb: "Host=postgres;Port=5432;Database=support_db;Username=app;Password=${DB_PASSWORD}"

      Services__OrderUrl: "http://order:8080"
      Services__LicenseUrl: "http://license-vault:8080"

      Keycloak__MetadataAddress: "http://keycloak:8080/realms/marketplace/.well-known/openid-configuration"
      Keycloak__Issuer: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/marketplace"

    depends_on:
      postgres:
        condition: service_healthy
      order:
        condition: service_started
      license-vault:
        condition: service_started
      keycloak:
        condition: service_started

    networks:
      - backend

    restart: unless-stopped


  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      Cors__Origins__0: "${FRONTEND_PUBLIC_URL:-http://localhost:5173}"
    ports:
      - "8000:8080"
    depends_on:
      - catalog
      - order
      - license-vault
      - payment
      - support
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  rabbitmq_data:
  pg_data:
  kc_data:
